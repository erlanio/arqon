name: Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Dependências Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Testes da aplicação web
        run: node --test tests/*.test.mjs uml-activity/tests/*.test.mjs uml-class/tests/*.test.mjs uml-sequence/tests/*.test.mjs
        shell: bash
      - name: Pillow para gerar ícones
        run: python -m pip install Pillow==11.3.0
        shell: bash
      - name: CLI Tauri
        working-directory: desktop
        run: npm ci --no-audit --no-fund
        shell: bash
      - name: Build Tauri
        run: npm run build --prefix desktop
      - name: Verificar assinatura macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict "desktop/src-tauri/target/release/bundle/macos/brModelo Studio.app"
          for dmg in desktop/src-tauri/target/release/bundle/dmg/*.dmg; do hdiutil verify "$dmg"; done
      - uses: actions/upload-artifact@v4
        with:
          name: brmodelo-studio-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*
            desktop/src-tauri/target/release/bundle/msi/*
            desktop/src-tauri/target/release/bundle/deb/*
            desktop/src-tauri/target/release/bundle/appimage/*
            desktop/src-tauri/target/release/bundle/dmg/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
